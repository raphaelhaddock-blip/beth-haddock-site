<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <!-- Ondo Finance - Minimal logo with O symbol -->
  <g fill="#000000">
    <!-- Distinctive O with line through it -->
    <circle cx="18" cy="20" r="14" fill="none" stroke="#000000" stroke-width="3"/>
    <line x1="18" y1="6" x2="18" y2="34" stroke="#000000" stroke-width="3"/>
    <!-- Wordmark -->
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#000000">ONDO</text>
  </g>
</svg>
