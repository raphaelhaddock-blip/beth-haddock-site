<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50">
  <!-- Franklin Templeton - Navy blue wordmark with Ben Franklin silhouette icon -->
  <g fill="#001E62">
    <!-- Simplified medallion/coin icon -->
    <circle cx="22" cy="25" r="20" fill="none" stroke="#001E62" stroke-width="3"/>
    <circle cx="22" cy="25" r="15" fill="none" stroke="#001E62" stroke-width="2"/>
    <!-- Simplified Franklin profile -->
    <path d="M16 34 C16 29, 18 24, 22 22 C19 22, 17 19, 17 16 C17 12, 20 10, 23 10 C27 10, 30 12, 30 16 C30 19, 28 21, 26 22 C30 24, 32 29, 31 34 Z" fill="#001E62"/>
    <!-- Wordmark -->
    <text x="52" y="23" font-family="Georgia, serif" font-size="14" font-weight="600" letter-spacing="1">FRANKLIN</text>
    <text x="52" y="42" font-family="Georgia, serif" font-size="14" font-weight="600" letter-spacing="1">TEMPLETON</text>
  </g>
</svg>
