<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 45">
  <!-- Orca - Whale icon + wordmark -->
  <g>
    <!-- Simplified orca whale -->
    <ellipse cx="20" cy="22" rx="16" ry="12" fill="#1C1C24"/>
    <!-- White belly patch -->
    <ellipse cx="22" cy="26" rx="8" ry="5" fill="#FFFFFF"/>
    <!-- Dorsal fin -->
    <path d="M20 10 L22 22 L18 22 Z" fill="#1C1C24"/>
    <!-- Tail -->
    <path d="M4 18 L8 22 L4 26 L10 22 Z" fill="#1C1C24"/>
    <!-- Eye -->
    <circle cx="28" cy="18" r="2" fill="#FFD15C"/>
    <!-- Wordmark -->
    <text x="42" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#1C1C24">ORCA</text>
  </g>
</svg>
