<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 45">
  <!-- Balancer - Bold three circles icon + wordmark - Light for dark bg -->
  <g>
    <!-- Three overlapping circles (Balancer's iconic symbol) -->
    <circle cx="14" cy="22" r="10" fill="none" stroke="#6CC8F1" stroke-width="3"/>
    <circle cx="26" cy="12" r="10" fill="none" stroke="#6CC8F1" stroke-width="3"/>
    <circle cx="26" cy="32" r="10" fill="none" stroke="#6CC8F1" stroke-width="3"/>
    <!-- Bold Wordmark -->
    <text x="48" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#FFFFFF">Balancer</text>
  </g>
</svg>
