<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40">
  <!-- Balancer - Three circles icon + wordmark -->
  <g>
    <!-- Three overlapping circles (Balancer's iconic symbol) -->
    <circle cx="12" cy="20" r="8" fill="none" stroke="#1E1E1E" stroke-width="2"/>
    <circle cx="22" cy="12" r="8" fill="none" stroke="#1E1E1E" stroke-width="2"/>
    <circle cx="22" cy="28" r="8" fill="none" stroke="#1E1E1E" stroke-width="2"/>
    <!-- Wordmark -->
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5" fill="#1E1E1E">Balancer</text>
  </g>
</svg>
