    <path d="M8 35 C5 30, 4 25, 6 20 C8 15, 12 12, 18 12 C22 12, 26 14, 28 18 C32 14, 36 12, 40 14 C44 16, 45 22, 42 28 C40 32, 36 35, 32 35 L8 35 Z" fill="#004668"/>
